spring.application.name=expense-limiter
server.port=8080

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/expenseDB
spring.data.mongodb.database=expenseDB

# JWT configuration
jwt.secret=myVerySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256Bits
jwt.expiration=86400000

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
